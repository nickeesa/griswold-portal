version: 2
updates:
  # Next.js frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      # One PR for the routine minor/patch noise; majors come as their own PRs.
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch"]
